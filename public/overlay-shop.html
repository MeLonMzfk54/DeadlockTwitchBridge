<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop Vote Overlay</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: transparent;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }

    /* Shop vote panel (OBS) — top-left for independent Browser Source placement */
    .shop-vote {
      position: fixed;
      top: 0;
      left: 0;
      width: 340px;
      padding: 14px 16px 16px;
      border-radius: 14px;
      background: rgba(10, 16, 24, 0.88);
      border: 1px solid rgba(106, 227, 229, 0.4);
      color: #e8eef5;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
      visibility: hidden;
    }
    .shop-vote.visible {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
    }
    .shop-vote .sv-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .shop-vote .sv-stage {
      margin: 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #0abab5;
    }
    .shop-vote .sv-timer {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      color: #f3f8ff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .shop-vote .sv-hint {
      margin: 0 0 10px;
      font-size: 0.82rem;
      color: #8fa0b5;
      line-height: 1.3;
      min-height: 1.1em;
    }
    .shop-vote .sv-rows {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .shop-vote .sv-row {
      display: grid;
      grid-template-columns: 72px 1fr 40px;
      align-items: center;
      gap: 8px;
      font-size: 0.88rem;
    }
    .shop-vote .sv-row.winner .sv-name {
      color: #6be08b;
      font-weight: 700;
    }
    .shop-vote .sv-name {
      color: #c6d3e0;
      text-transform: capitalize;
    }
    .shop-vote .sv-bar-wrap {
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .shop-vote .sv-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #0abab5, #6ae3e5);
      transition: width 0.25s ease;
    }
    .shop-vote .sv-row.winner .sv-bar {
      background: linear-gradient(90deg, #3db86a, #6be08b);
    }
    .shop-vote .sv-pct {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: #8fa0b5;
      font-size: 0.8rem;
    }
    .shop-vote .sv-result {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 0.9rem;
      line-height: 1.35;
      color: #c6d3e0;
      display: none;
    }
    .shop-vote .sv-result.show {
      display: block;
    }
    .shop-vote .sv-result strong {
      color: #f3f8ff;
      font-weight: 700;
    }
    .shop-vote .sv-status {
      margin-top: 6px;
      font-size: 0.82rem;
      color: #DB694E;
    }
    .shop-vote .sv-status.ok {
      color: #6be08b;
    }
  </style>
</head>
<body>
  <div class="shop-vote" id="shopVote" aria-hidden="true">
    <div class="sv-head">
      <p class="sv-stage" id="svStage">Shop Vote</p>
      <p class="sv-timer" id="svTimer">—</p>
    </div>
    <p class="sv-hint" id="svHint"></p>
    <div class="sv-rows" id="svRows"></div>
    <div class="sv-result" id="svResult">
      <div id="svItem"></div>
      <div class="sv-status" id="svStatus"></div>
    </div>
  </div>

  <script>
    const LIVE_STAGES = new Set([
      "voting_category",
      "voting_tier",
      "voting_combined",
      "applying",
      "waiting_shop",
    ]);
    const HOLD_STAGES = new Set(["rolled", "purchased"]);
    let postRollHoldMs = 8000;

    let voteHoldUntil = 0;
    let voteHoldKey = null;

    const CAT_LABELS = { weapon: "Weapon", vitality: "Vitality", spirit: "Spirit" };
    const STAGE_LABELS = {
      voting_category: "Vote · Category",
      voting_tier: "Vote · Tier",
      voting_combined: "Vote · Type + Tier",
      applying: "Applying",
      rolled: "Rolled",
      waiting_shop: "Waiting shop",
      purchased: "Purchased",
      failed: "Failed",
      idle: "Idle",
    };

    async function poll() {
      try {
        const status = await fetch("/api/status").then((r) => r.json());
        updateShopVote(status.shopVote);
      } catch {}
    }

    function shouldShowShopVote(stage, now) {
      if (LIVE_STAGES.has(stage)) {
        voteHoldUntil = 0;
        voteHoldKey = null;
        return true;
      }
      if (HOLD_STAGES.has(stage)) {
        const key = stage;
        if (voteHoldKey !== key) {
          voteHoldKey = key;
          voteHoldUntil = now + postRollHoldMs;
        }
        return now < voteHoldUntil;
      }
      if (voteHoldUntil && now < voteHoldUntil) {
        return true;
      }
      voteHoldUntil = 0;
      voteHoldKey = null;
      return false;
    }

    function formatTimer(snap, now) {
      const stage = snap.stage || "idle";
      if (
        snap.stageEndsAt &&
        (stage === "voting_category" ||
          stage === "voting_tier" ||
          stage === "voting_combined")
      ) {
        return String(Math.max(0, Math.ceil((snap.stageEndsAt - now) / 1000))) + "s";
      }
      if (stage === "applying") return "…";
      if (stage === "waiting_shop") return "⏳";
      if (stage === "rolled") return "✓";
      if (stage === "purchased") return "✓";
      return "—";
    }

    function formatHint(snap) {
      const stage = snap.stage || "idle";
      if (stage === "voting_combined") {
        return "Chat: !w 1 · type + tier together or separate";
      }
      if (stage === "voting_category") {
        return "Chat: weapon / vitality / spirit";
      }
      if (stage === "voting_tier") {
        const cat = snap.winnerCategory
          ? (CAT_LABELS[snap.winnerCategory] || snap.winnerCategory)
          : "—";
        return `Category: ${cat} · Chat: 1–4`;
      }
      if (stage === "applying") {
        return snap.cmdReceived ? "Mod received cmd…" : "Sending roll…";
      }
      if (stage === "waiting_shop") {
        const reason = snap.lastWaiting && snap.lastWaiting.reason
          ? String(snap.lastWaiting.reason)
          : "awaiting_shop_range";
        if (reason === "out_of_range" || reason === "awaiting_shop_range") {
          return "Walk to the shop";
        }
        if (reason === "cant_afford") return "Can't afford — waiting";
        if (reason === "shop_closed" || reason === "shop_ui_closed") {
          return "Open the shop";
        }
        return reason.replace(/_/g, " ");
      }
      if (stage === "rolled") return "Purchasing…";
      if (stage === "purchased") return "Item purchased";
      return "";
    }

    function renderBars(snap) {
      const stage = snap.stage || "idle";
      const rows = document.getElementById("svRows");
      const showCats =
        stage === "voting_category" ||
        stage === "voting_tier" ||
        stage === "voting_combined" ||
        stage === "applying" ||
        HOLD_STAGES.has(stage) ||
        stage === "waiting_shop";
      const showTiers =
        stage === "voting_tier" ||
        stage === "voting_combined" ||
        stage === "applying" ||
        HOLD_STAGES.has(stage) ||
        stage === "waiting_shop";

      const parts = [];
      if (showCats) {
        const pct = snap.categoryPct || {};
        const winner = snap.winnerCategory;
        for (const key of ["weapon", "vitality", "spirit"]) {
          const p = pct[key] != null ? Number(pct[key]) : 0;
          const win = winner === key ? " winner" : "";
          parts.push(
            `<div class="sv-row${win}">` +
              `<span class="sv-name">${CAT_LABELS[key]}</span>` +
              `<div class="sv-bar-wrap"><div class="sv-bar" style="width:${Math.min(100, Math.max(0, p))}%"></div></div>` +
              `<span class="sv-pct">${p}%</span>` +
            `</div>`
          );
        }
      }
      if (showTiers) {
        const pct = snap.tierPct || {};
        const winnerTier = snap.winnerTier != null ? String(snap.winnerTier) : null;
        for (const key of ["1", "2", "3", "4"]) {
          const p = pct[key] != null ? Number(pct[key]) : 0;
          const win = winnerTier === key ? " winner" : "";
          parts.push(
            `<div class="sv-row${win}">` +
              `<span class="sv-name">Tier ${key}</span>` +
              `<div class="sv-bar-wrap"><div class="sv-bar" style="width:${Math.min(100, Math.max(0, p))}%"></div></div>` +
              `<span class="sv-pct">${p}%</span>` +
            `</div>`
          );
        }
      }
      rows.innerHTML = parts.join("");
    }

    function renderResult(snap) {
      const result = document.getElementById("svResult");
      const itemEl = document.getElementById("svItem");
      const statusEl = document.getElementById("svStatus");
      const stage = snap.stage || "idle";
      const rolled = snap.lastRolled;
      const name = rolled
        ? String(rolled.name || rolled.cls || "")
        : "";
      const tier = rolled && rolled.tier != null ? String(rolled.tier) : "";

      let show = false;
      let itemHtml = "";
      let statusText = "";
      let statusOk = false;

      if (name) {
        show = true;
        itemHtml = `Item: <strong>${escapeHtml(name)}</strong>${tier ? ` · T${escapeHtml(tier)}` : ""}`;
      } else if (snap.winnerCategory && snap.winnerTier != null) {
        const cat = CAT_LABELS[snap.winnerCategory] || snap.winnerCategory;
        if (stage === "applying" || stage === "waiting_shop") {
          show = true;
          itemHtml = `Winner: <strong>${escapeHtml(cat)} T${escapeHtml(String(snap.winnerTier))}</strong>`;
        }
      }

      if (stage === "waiting_shop") {
        show = true;
        statusText = "Waiting for purchase…";
        statusOk = false;
      } else if (stage === "rolled") {
        show = true;
        statusText = "Rolled — buying…";
        statusOk = false;
      } else if (stage === "purchased") {
        show = true;
        statusText = snap.lastPurchase && snap.lastPurchase.ok === false
          ? "Purchase failed"
          : "Purchased";
        statusOk = !(snap.lastPurchase && snap.lastPurchase.ok === false);
      } else if (voteHoldKey === "purchased" && name) {
        show = true;
        statusText = "Purchased";
        statusOk = true;
      }

      itemEl.innerHTML = itemHtml;
      statusEl.textContent = statusText;
      statusEl.classList.toggle("ok", statusOk);
      result.classList.toggle("show", show && (itemHtml || statusText));
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function updateShopVote(snap) {
      const panel = document.getElementById("shopVote");
      if (!snap || typeof snap !== "object") {
        panel.classList.remove("visible");
        panel.setAttribute("aria-hidden", "true");
        return;
      }
      const hold =
        snap.settings && Number(snap.settings.overlayHoldMs) > 0
          ? Number(snap.settings.overlayHoldMs)
          : snap.overlayHoldMs;
      if (Number.isFinite(hold) && hold > 0) {
        postRollHoldMs = hold;
      }
      const now = Date.now();
      const stage = snap.stage || "idle";
      const visible = shouldShowShopVote(stage, now);

      if (!visible) {
        panel.classList.remove("visible");
        panel.setAttribute("aria-hidden", "true");
        return;
      }

      document.getElementById("svStage").textContent =
        STAGE_LABELS[stage] || stage;
      document.getElementById("svTimer").textContent = formatTimer(snap, now);
      document.getElementById("svHint").textContent = formatHint(snap);
      renderBars(snap);
      renderResult(snap);

      panel.classList.add("visible");
      panel.setAttribute("aria-hidden", "false");
    }

    setInterval(poll, 1000);
    poll();
  </script>
</body>
</html>
